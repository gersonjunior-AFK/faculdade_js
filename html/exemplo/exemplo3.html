<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        switch (nota = Number(prompt("Digite um número de 1 a 7 para saber o dia da semana:"))) {
            case 1:
                alert("Hoje é domingo");
                break;
            case 2:
                alert("Hoje é segunda-feira");
                break;
            case 3:
                alert("Hoje é terça-feira");
                break;
            case 4:
                alert("Hoje é quarta-feira");
                break;
            case 5:
                alert("Hoje é quinta-feira");
                break;
            case 6:
                alert("Hoje é sexta-feira");
                break;
            case 7:
                alert("Hoje é sábado");
                break;
            default:
                alert("Dia inválido");
        }
    </script>
</body>
</html>
