<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let contador = 10;
      let resultado = "";
      while (contador > 0) {
        resultado += contador + "\n";
        contador--;
      }
      alert(resultado);
    </script>
  </body>
</html>
