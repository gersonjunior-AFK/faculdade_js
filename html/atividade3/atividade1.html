<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somar números</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <script src="../../js/atividade3/soma.js" defer></script>
  </head>
  <body>
    <main>
      <section class="card">
        <h1 class="title">Somar números</h1>
        <p class="subtitle">Digite dois números e clique em somar.</p>

        <form>
          <div class="form-grid">
            <div class="field">
              <label for="numero1">informe a idade</label>
              <input id="numero1" name="numero1" type="number" step="any" />
            </div>

            <div class="field">
              <label for="numero2">Número 2</label>
              <input id="numero2" name="numero2" type="number" step="any" />
            </div>
          </div>
     
          </div>
          <div class="button-row">
          <button type="button" onclick="mostrarresultado()">Calcular soma</button>
        </div>

        <div id="alertaResultado" class="alert" role="status"></div>
        <h2 id="resultado"></h2>
        </form>
      </section>
    </main>

  </body>
</html>
