<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora com Botões</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7fb, #dfeaff);
      }

      .container {
        width: min(420px, 90%);
        background: #fff;
        padding: 30px 24px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      h1 {
        margin-top: 0;
        text-align: center;
        color: #1f2937;
      }

      .campo {
        display: flex;
        flex-direction: column;
        margin-bottom: 16px;
      }

      label {
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
      }

      input {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 16px;
      }

      .botoes {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin: 20px 0;
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      button:hover {
        background: #1d4ed8;
      }

      #resultado {
        margin-top: 12px;
        padding: 12px;
        background: #eff6ff;
        border-radius: 8px;
        color: #1e3a8a;
        font-weight: bold;
      }
    </style>
    <script src="../js/teste.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Calculadora com Botões</h1>

      <div class="campo">
        <label for="numero1">Primeiro número</label>
        <input id="numero1" type="number" step="any" placeholder="Digite o primeiro número" />
      </div>

      <div class="campo">
        <label for="numero2">Segundo número</label>
        <input id="numero2" type="number" step="any" placeholder="Digite o segundo número" />
      </div>

      <div class="botoes">
        <button type="button" onclick="somar()">Somar</button>
        <button type="button" onclick="subtrair()">Subtrair</button>
        <button type="button" onclick="multiplicar()">Multiplicar</button>
        <button type="button" onclick="dividir()">Dividir</button>
      </div>

      <p id="resultado">Resultado: </p>
    </main>
  </body>
</html>
