<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <main>
      <section class="card register-card">
        <h1 class="title">Cadastro</h1>
        <p class="subtitle">Crie sua conta para continuar.</p>

        <form>
          <div class="form-grid">
            <div class="field">
              <label for="nome-completo">Nome completo</label>
              <input id="nome-completo" type="text" placeholder="Nome e sobrenome" />
            </div>

            <div class="field">
              <label for="usuario">Usuário</label>
              <input id="usuario" type="text" placeholder="Seu nome de usuário" />
            </div>

            <div class="field">
              <label for="email-cadastro">E-mail</label>
              <input id="email-cadastro" type="email" placeholder="seuemail@email.com" />
            </div>

            <div class="field">
              <label for="telefone">Telefone</label>
              <input id="telefone" type="tel" placeholder="(00) 00000-0000" />
            </div>

            <div class="field">
              <label for="senha">Senha</label>
              <input id="senha" type="password" placeholder="Digite sua senha" />
            </div>

            <div class="field">
              <label for="confirm-senha">Confirmar senha</label>
              <input id="confirm-senha" type="password" placeholder="Repita a senha" />
            </div>

            <div class="field full">
              <label for="interesse">Interesse</label>
              <select id="interesse">
                <option value="">Selecione</option>
                <op-/*-tion value="desenvolvimento">Desenvolvimento</option>
                <option value="design">Design</option>
                <option value="marketing">Marketing</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div class="field full">
              <label class="checkbox-row">
                <input type="checkbox" />
                Aceito os termos e condições.
              </label>
            </div>
          </div>

          <button type="submit" onclick="cadastrar()">Cadastrar</button>
        </form>

        <div class="switch-link">
          Já possui conta?
          <a href="formulario.html">Voltar para o formulário</a>
        </div>
      </section>
    </main>
  </body>
</html>
