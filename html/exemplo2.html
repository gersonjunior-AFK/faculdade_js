<h1>testeeeeeeeeeeeeeeeeeeeeeeeee</h1>


    <script>
      let nota = Number(prompt("Qual sua nota?"));
      if (nota >= 6 && nota <= 10) {
        alert("aprovado");
      } else if (nota >= 4 && nota < 6) {
        alert("recuperação");
      } else if (nota >= 0 && nota < 4) {
        alert("reprovado");
      }
      else {
        alert("nota inválida");
      }
    </script>
  </body>
