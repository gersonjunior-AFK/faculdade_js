<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="../../css/styles.css" />
    <script src="../../js/aula2/teste.js" defer></script>
  </head>
  <body>
    
    <main class="container">
      <h1>Calculadora de IMC</h1>
      <form>
        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input id="peso" type="number" step="any" placeholder="Digite seu peso" />
        </div>
        <div class="campo">
          <label for="altura">Altura (m)</label>
          <input id="altura" type="number" step="any" placeholder="Digite sua altura" />
        </div>

        <div class="botoes">
          <button type="button" onclick="classificarIMC()">Calcular IMC</button>
        </div>
        <p id="resultado">Resultado: </p>
      </form>
    </main>
  </body>
</html>
